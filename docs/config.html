<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f5">
  <title>Nimbus Settings</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172b2d;
      background: #f3f6f5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 85% 12%, #fff3bd 0, transparent 34%), #f3f6f5;
    }

    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #d8e2df;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 16px 48px rgb(23 43 45 / 8%);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 24px;
      line-height: 1.15;
    }

    label {
      display: flex;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 17px;
      font-weight: 600;
    }

    input {
      width: 24px;
      height: 24px;
      accent-color: #e2ae00;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border: 0;
      border-radius: 6px;
      background: #173f3c;
      color: white;
      font: inherit;
      font-weight: 700;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid #dfaa00;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Nimbus</h1>
    <form id="settings-form">
      <label for="analog-mode">
        <span>Analog time</span>
        <input id="analog-mode" name="analog_mode" type="checkbox">
      </label>
      <button type="submit">Save</button>
    </form>
  </main>
  <script>
    function getQueryParam(name, fallback) {
      var entries = window.location.search.substring(1).split('&');
      for (var i = 0; i < entries.length; i++) {
        var parts = entries[i].split('=');
        if (decodeURIComponent(parts[0]) === name) {
          return decodeURIComponent(parts.slice(1).join('=').replace(/\+/g, ' '));
        }
      }
      return fallback;
    }

    var analogMode = document.getElementById('analog-mode');
    analogMode.checked = getQueryParam('analog_mode', '0') === '1';

    document.getElementById('settings-form').addEventListener('submit', function(event) {
      event.preventDefault();
      var settings = { analog_mode: analogMode.checked };
      var returnTo = getQueryParam('return_to', 'pebblejs://close#');
      window.location.href = returnTo + encodeURIComponent(JSON.stringify(settings));
    });
  </script>
</body>
</html>
